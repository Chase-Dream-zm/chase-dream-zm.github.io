<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>双人聊天室</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #eef0f4; color: #1c1e21; font-size: 15px;
  }
  #app { height: 100%; }
  .screen { height: 100%; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- 登录页 ---------- */
  #loginScreen {
    align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(160deg, #e6ecff 0%, #eef0f4 62%);
    overflow-y: auto;
  }
  .login-card {
    width: 100%; max-width: 370px; background: #fff;
    border-radius: 20px; padding: 30px 24px 22px;
    box-shadow: 0 18px 50px rgba(31, 45, 90, .12); text-align: center;
  }
  .logo { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #8a8f98; }
  .field { display: block; text-align: left; margin-bottom: 14px; }
  .field span { display: block; font-size: 12px; color: #8a8f98; margin-bottom: 6px; padding-left: 2px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #e6e8eb; background: #fafbfc;
    font: inherit; font-size: 15px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input:focus { border-color: #4f7cff; background: #fff; }
  .primary {
    width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 12px;
    background: #4f7cff; color: #fff; font: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .1s;
  }
  .primary:hover { background: #3d68e8; }
  .primary:active { transform: scale(.985); }
  .primary:disabled { background: #b9c6f0; cursor: default; }
  .tip { margin: 16px 0 0; font-size: 12px; color: #a0a5ad; line-height: 1.6; }

  /* ---------- 聊天页 ---------- */
  #chatScreen {
    max-width: 780px; width: 100%; margin: 0 auto;
    background: #eef0f4; position: relative;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; background: rgba(255,255,255,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #e6e8eb; position: relative; z-index: 5;
  }
  .head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #34c759;
    box-shadow: 0 0 0 3px rgba(52,199,89,.15); flex: none;
  }
  .room-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-sub { font-size: 12px; color: #8a8f98; margin-top: 1px; }
  .icon-btn {
    border: 0; background: transparent; font-size: 22px; line-height: 1;
    color: #6b7280; cursor: pointer; padding: 4px 12px 8px; border-radius: 10px;
  }
  .icon-btn:hover { background: #f0f2f5; }

  .menu {
    position: absolute; top: 54px; right: 12px; background: #fff;
    border-radius: 14px; box-shadow: 0 12px 32px rgba(20,30,60,.16);
    padding: 6px; min-width: 175px; z-index: 20;
    display: flex; flex-direction: column; animation: pop .12s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; } }
  .menu button {
    border: 0; background: transparent; text-align: left; padding: 11px 14px;
    border-radius: 10px; font: inherit; font-size: 14px; color: #1c1e21; cursor: pointer;
  }
  .menu button:hover { background: #f2f4f7; }
  .menu button.danger { color: #e5484d; }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 12px;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .day {
    align-self: center; font-size: 11px; color: #8a8f98;
    background: rgba(0,0,0,.06); padding: 3px 10px; border-radius: 10px; margin: 4px 0;
  }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 84%; }
  .msg.theirs { align-self: flex-start; }
  .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 600; user-select: none;
  }
  .content { display: flex; flex-direction: column; min-width: 0; }
  .msg.mine .content { align-items: flex-end; }
  .meta {
    font-size: 11px; color: #9aa0a8; margin: 0 6px 4px;
    display: flex; gap: 6px; align-items: center;
  }
  .bubble {
    padding: 9px 13px; border-radius: 16px; background: #fff;
    font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 1px 2px rgba(20,30,60,.06); border-bottom-left-radius: 5px;
  }
  .msg.mine .bubble {
    background: #4f7cff; color: #fff;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 5px;
    box-shadow: 0 2px 8px rgba(79,124,255,.28);
  }

  .composer {
    display: flex; gap: 9px; align-items: flex-end;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid #e6e8eb;
  }
  #msgInput {
    flex: 1; resize: none; border: 1.5px solid #e6e8eb; border-radius: 20px;
    padding: 10px 15px; font: inherit; font-size: 15px; line-height: 1.4;
    max-height: 120px; outline: none; background: #fafbfc;
    transition: border-color .15s, background .15s;
  }
  #msgInput:focus { border-color: #4f7cff; background: #fff; }
  .send {
    flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: #4f7cff; color: #fff; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
    transition: transform .1s, background .15s;
    box-shadow: 0 2px 10px rgba(79,124,255,.35);
  }
  .send:hover { background: #3d68e8; }
  .send:active { transform: scale(.92); }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 10px);
    background: rgba(28,30,35,.9); color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 登录页 ========== -->
  <section id="loginScreen" class="screen">
    <div class="login-card">
      <div class="logo">💬</div>
      <h1>双人聊天室</h1>
      <p class="sub">两个人使用同一个房间号即可实时聊天</p>

      <label class="field">
        <span>昵称</span>
        <input id="nameInput" type="text" maxlength="12" placeholder="例如：小明" autocomplete="off" />
      </label>

      <label class="field">
        <span>房间号</span>
        <input id="roomInput" type="text" maxlength="24" placeholder="例如：our-room" autocomplete="off" />
      </label>

      <button id="enterBtn" class="primary">进入聊天室</button>
      <p class="tip" id="loginTip">把网址 + 房间号发给对方，两人就能聊天了</p>
    </div>
  </section>

  <!-- ========== 聊天页 ========== -->
  <section id="chatScreen" class="screen hidden">
    <header>
      <div class="head-left">
        <span class="dot"></span>
        <div>
          <div class="room-name" id="roomLabel">房间</div>
          <div class="room-sub" id="meLabel"></div>
        </div>
      </div>
      <button id="menuBtn" class="icon-btn" aria-label="菜单">⋯</button>

      <div id="menu" class="menu hidden">
        <button data-act="rename">修改昵称</button>
        <button data-act="link">复制邀请链接</button>
        <button data-act="clear" class="danger">清空聊天记录</button>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <textarea id="msgInput" rows="1" placeholder="输入消息…" maxlength="2000"></textarea>
      <button id="sendBtn" class="send" aria-label="发送">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M3.4 20.4 21.9 12 3.4 3.6 3.4 10.2 16.5 12 3.4 13.8z"/>
        </svg>
      </button>
    </div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase, ref, push, onChildAdded, remove, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* ==================================================================
   ①  把下面的配置换成你自己的 Firebase 项目配置
   （控制台 → 项目设置 → 常规 → 你的应用 → Web 应用 → firebaseConfig）
   ================================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
/* ================================================================== */

const $ = (id) => document.getElementById(id);

const loginScreen = $("loginScreen");
const chatScreen  = $("chatScreen");
const nameInput   = $("nameInput");
const roomInput   = $("roomInput");
const enterBtn    = $("enterBtn");
const loginTip    = $("loginTip");
const roomLabel   = $("roomLabel");
const meLabel     = $("meLabel");
const messagesEl  = $("messages");
const msgInput    = $("msgInput");
const sendBtn     = $("sendBtn");
const menuBtn     = $("menuBtn");
const menuEl      = $("menu");

let auth = null, db = null;
let myName = "";
let currentRoom = "";
let unsubscribe = null;      // 消息监听取消函数
const rendered = new Set();  // 已渲染的消息 id，防重复
let lastDayKey = "";

/* ---------------- 初始化 Firebase ---------------- */
(function initFirebase() {
  if (firebaseConfig.databaseURL.includes("YOUR_") || firebaseConfig.apiKey.includes("YOUR_")) {
    loginTip.textContent = "⚠️ 请先在 index.html 里填写你的 Firebase 配置";
    loginTip.style.color = "#e5484d";
    enterBtn.disabled = true;
    return;
  }
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
  } catch (e) {
    console.error(e);
    loginTip.textContent = "⚠️ Firebase 初始化失败：" + e.message;
    loginTip.style.color = "#e5484d";
    enterBtn.disabled = true;
  }
})();

/* ---------------- 表单预填 ---------------- */
const hashRoom = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
nameInput.value = localStorage.getItem("chat_name") || "";
roomInput.value = hashRoom || localStorage.getItem("chat_room") || "0610";
(nameInput.value ? roomInput : nameInput).focus();

/* ---------------- 进入聊天室 ---------------- */
enterBtn.addEventListener("click", async () => {
  if (!auth) return;

  const name = nameInput.value.trim();
  const room = roomInput.value.trim().replace(/[.#$/\[\]]/g, "_");

  if (!name) { nameInput.focus(); return flashTip("请先填写昵称"); }
  if (!room) { roomInput.focus(); return flashTip("请先填写房间号"); }

  enterBtn.disabled = true;
  enterBtn.textContent = "连接中…";

  try {
    const cred = auth.currentUser ? { user: auth.currentUser } : await signInAnonymously(auth);
    if (!cred.user) throw new Error("匿名登录失败");
  } catch (e) {
    enterBtn.disabled = false;
    enterBtn.textContent = "进入聊天室";
    flashTip("连接失败：" + e.message + "（请确认已启用「匿名」登录方式）");
    return;
  }

  myName = name.slice(0, 12);
  currentRoom = room;
  localStorage.setItem("chat_name", myName);
  localStorage.setItem("chat_room", room);

  loginScreen.classList.add("hidden");
  chatScreen.classList.remove("hidden");
  roomLabel.textContent = room;
  meLabel.textContent = "我是 " + myName;
  document.title = room + " · 双人聊天室";

  openMessageStream();
  setTimeout(() => msgInput.focus(), 100);
});

let tipTimer;
function flashTip(msg) {
  loginTip.textContent = msg;
  loginTip.style.color = "#e5484d";
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {
    loginTip.textContent = "把网址 + 房间号发给对方，两人就能聊天了";
    loginTip.style.color = "";
  }, 3200);
}

/* ---------------- 监听消息（实时 + 历史记录） ---------------- */
function openMessageStream() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }

  messagesEl.innerHTML = "";
  rendered.clear();
  lastDayKey = "";

  // 读取最近 300 条，更早的记录仍然保留在数据库中
  const q = query(ref(db, `rooms/${currentRoom}/messages`), limitToLast(300));

  unsubscribe = onChildAdded(q, (snap) => {
    if (rendered.has(snap.key)) return;
    rendered.add(snap.key);

    const stick = isNearBottom();
    renderMessage(snap.val());
    if (stick) scrollToBottom();
  }, (err) => {
    console.error(err);
    appendSystem("读取消息失败：" + err.message);
  });
}

/* ---------------- 渲染单条消息 ---------------- */
function renderMessage(m) {
  if (!m || !m.text) return;

  const uid = auth.currentUser ? auth.currentUser.uid : null;
  const mine = m.uid && m.uid === uid;
  const t = new Date(m.ts || Date.now());

  // 日期分隔
  const dayKey = t.getFullYear() + "-" + t.getMonth() + "-" + t.getDate();
  if (dayKey !== lastDayKey) {
    lastDayKey = dayKey;
    const day = document.createElement("div");
    day.className = "day";
    day.textContent = formatDay(t);
    messagesEl.appendChild(day);
  }

  const row = document.createElement("div");
  row.className = "msg " + (mine ? "mine" : "theirs");

  if (!mine) {
    const av = document.createElement("div");
    av.className = "avatar";
    av.style.background = colorFor(m.uid || m.name || "?");
    av.textContent = (m.name || "?").trim().charAt(0).toUpperCase();
    row.appendChild(av);
  }

  const content = document.createElement("div");
  content.className = "content";

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML =
    "<span>" + escapeHtml(mine ? "我" : (m.name || "匿名")) + "</span>" +
    "<span>" + formatTime(t) + "</span>";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = m.text;   // 用 textContent，天然防 XSS

  content.appendChild(meta);
  content.appendChild(bubble);
  row.appendChild(content);
  messagesEl.appendChild(row);
}

/* ---------------- 发送消息 ---------------- */
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !currentRoom) return;
  if (!auth || !auth.currentUser) { appendSystem("尚未连接，请刷新页面重试"); return; }

  msgInput.value = "";
  autoGrow();

  try {
    await push(ref(db, `rooms/${currentRoom}/messages`), {
      uid: auth.currentUser.uid,
      name: myName,
      text: text,
      ts: Date.now()
    });
  } catch (e) {
    console.error(e);
    appendSystem("发送失败：" + e.message);
  }
}

sendBtn.addEventListener("click", sendMessage);

msgInput.addEventListener("keydown", (e) => {
  // 回车发送，Shift+回车换行；兼容中文输入法
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener("input", autoGrow);

function autoGrow() {
  msgInput.style.height = "auto";
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
}

/* ---------------- 滚动控制 ---------------- */
function isNearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 160;
}
function scrollToBottom(smooth) {
  requestAnimationFrame(() => {
    messagesEl.scrollTo({
      top: messagesEl.scrollHeight,
      behavior: smooth ? "smooth" : "auto"
    });
  });
}

/* ---------------- 菜单 ---------------- */
menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  menuEl.classList.toggle("hidden");
});
document.addEventListener("click", () => menuEl.classList.add("hidden"));

menuEl.addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  menuEl.classList.add("hidden");
  const act = btn.dataset.act;

  if (act === "rename") {
    const nn = prompt("输入新的昵称：", myName);
    if (nn && nn.trim()) {
      myName = nn.trim().slice(0, 12);
      localStorage.setItem("chat_name", myName);
      meLabel.textContent = "我是 " + myName;
      nameInput.value = myName;
      toast("昵称已更新（仅对新消息生效）");
    }
  }

  if (act === "link") {
    const url = location.origin + location.pathname + "#" + encodeURIComponent(currentRoom);
    try {
      await navigator.clipboard.writeText(url);
      toast("邀请链接已复制");
    } catch {
      prompt("复制这个链接发给对方：", url);
    }
  }

  if (act === "clear") {
    if (!confirm("确定要清空本房间的全部聊天记录吗？此操作不可恢复。")) return;
    try {
      await remove(ref(db, `rooms/${currentRoom}/messages`));
      messagesEl.innerHTML = "";
      rendered.clear();
      lastDayKey = "";
      openMessageStream();
      toast("聊天记录已清空");
    } catch (err) {
      toast("清空失败：" + err.message);
    }
  }
});

/* ---------------- 工具函数 ---------------- */
function appendSystem(text) {
  const d = document.createElement("div");
  d.className = "day";
  d.textContent = text;
  messagesEl.appendChild(d);
  scrollToBottom();
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatTime(d) {
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function formatDay(d) {
  const now = new Date();
  const yest = new Date();
  yest.setDate(now.getDate() - 1);
  const same = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();
  if (same(d, now)) return "今天";
  if (same(d, yest)) return "昨天";
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

const PALETTE = ["#4f7cff", "#ff7a59", "#12b886", "#845ef7",
                 "#f59f00", "#e8590c", "#0ca678", "#d6336c"];
function colorFor(seed) {
  const s = String(seed);
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

let toastEl;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
}
</script>
